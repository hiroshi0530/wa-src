[project]
name = "wa-src"
version = "0.1.0"
description = "Python 3.14 environment for the numerical computing examples on wayama.io"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "ipykernel",
    "ipython",
    "ipywidgets",
    "jupyterlab",
    "matplotlib",
    "networkx",
    "numpy",
    "pandas",
    "polars",
    "scikit-learn",
    "scipy",
    "seaborn",
    "sympy",
    "watermark",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
